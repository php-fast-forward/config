name: File Persistence Runtime

on:
  push:
    paths:
      - 'src/**'
      - composer.json
      - composer.lock
      - '.github/fixtures/file-persistence-consumer/**'
      - '.github/workflows/file-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: File persistence (Windows, PHP ${{ matrix.php }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    env:
      COMPOSER_MIRROR_PATH_REPOS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install isolated runtime consumer and verify persistence
        shell: pwsh
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP 'file-persistence-consumer'
          Copy-Item .github/fixtures/file-persistence-consumer $consumer -Recurse
          composer --working-dir="$consumer" config repositories.checkout path "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          composer --working-dir="$consumer" install --no-dev --no-plugins --no-scripts --no-interaction --no-progress --prefer-dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          php "$consumer/smoke.php"
          exit $LASTEXITCODE
